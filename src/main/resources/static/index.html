<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List | Task Manager</title>
    <!-- Tailwind CSS CDN for modern UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons for clean UI symbols -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-full flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Toast Notification Container (Shows API response feedback) -->
    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <div class="max-w-4xl mx-auto w-full px-4 py-8 md:py-12 flex-1">
        
        <!-- App Header & Live Stats Dashboard -->
        <header class="mb-8 bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-2xl p-6 shadow-xl relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
            
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-6 relative z-10">
                <div>
                    <div class="flex items-center gap-3 mb-1">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                            <i class="fa-solid fa-list-check text-white text-xl"></i>
                        </div>
                        <h1 class="text-2xl md:text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-indigo-300">
                            To-Do List
                        </h1>
                    </div>
                    <p class="text-slate-400 text-sm">Organize your daily tasks seamlessly with real-time API synchronization.</p>
                </div>

                <!-- Progress Metric Widget -->
                <div class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-4 min-w-[240px]">
                    <div class="flex justify-between items-center text-xs font-semibold text-slate-300 mb-2">
                        <span>Progress</span>
                        <span id="completionPercent">0%</span>
                    </div>
                    <!-- Progress Bar -->
                    <div class="w-full bg-slate-950 rounded-full h-2.5 overflow-hidden border border-slate-800">
                        <div id="progressBar" class="bg-gradient-to-r from-indigo-500 to-emerald-400 h-2.5 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between items-center text-xs text-slate-400 mt-2">
                        <span><strong id="completedCount" class="text-indigo-400">0</strong> completed</span>
                        <span><strong id="totalCount" class="text-slate-200">0</strong> total</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Task Management Container -->
        <main class="space-y-6">
            
            <!-- Task Creation Form (POST /api/tasks) -->
            <section class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 md:p-6 shadow-lg backdrop-blur-sm">
                <form id="addTaskForm" class="flex flex-col sm:flex-row gap-3">
                    <div class="relative flex-1">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-plus"></i>
                        </div>
                        <input 
                            type="text" 
                            id="taskInput" 
                            placeholder="What needs to be done today?" 
                            required
                            class="w-full pl-11 pr-4 py-3 bg-slate-950/80 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-sm md:text-base"
                        >
                    </div>
                    <button 
                        type="submit" 
                        id="addButton"
                        class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white font-medium text-sm rounded-xl shadow-lg shadow-indigo-600/25 flex items-center justify-center gap-2 transition-all cursor-pointer"
                    >
                        <span>Add Task</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </form>
            </section>

            <!-- Filter Tabs & Quick Action Bar -->
            <div class="flex flex-wrap items-center justify-between gap-4 px-1">
                <!-- Filter Buttons -->
                <div class="flex items-center bg-slate-900 border border-slate-800 rounded-xl p-1 text-xs md:text-sm">
                    <button id="filterAll" onclick="setFilter('all')" class="px-4 py-1.5 rounded-lg font-medium transition-all bg-indigo-600 text-white shadow-sm">
                        All <span id="badgeAll" class="ml-1 opacity-80">(0)</span>
                    </button>
                    <button id="filterPending" onclick="setFilter('pending')" class="px-4 py-1.5 rounded-lg font-medium text-slate-400 hover:text-slate-200 transition-all">
                        Pending <span id="badgePending" class="ml-1 opacity-80">(0)</span>
                    </button>
                    <button id="filterCompleted" onclick="setFilter('completed')" class="px-4 py-1.5 rounded-lg font-medium text-slate-400 hover:text-slate-200 transition-all">
                        Completed <span id="badgeCompleted" class="ml-1 opacity-80">(0)</span>
                    </button>
                </div>

                <!-- Sync Indicator -->
                <div class="flex items-center gap-2 text-xs text-slate-400">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>Backend Status: <strong class="text-slate-300">Connected</strong></span>
                </div>
            </div>

            <!-- Task Items List (Rendered dynamically by app.js) -->
            <ul id="taskList" class="space-y-3 min-h-[200px]">
                <!-- Loading State Skeleton -->
                <li id="loadingSkeleton" class="bg-slate-900/50 border border-slate-800/60 rounded-xl p-4 animate-pulse flex items-center justify-between">
                    <div class="flex items-center gap-3 w-full">
                        <div class="w-5 h-5 bg-slate-800 rounded-md"></div>
                        <div class="h-4 bg-slate-800 rounded w-1/2"></div>
                    </div>
                </li>
            </ul>

            <!-- Empty State (Shown when no tasks match current filter) -->
            <div id="emptyState" class="hidden flex-col items-center justify-center text-center p-12 bg-slate-900/40 border border-slate-800/50 rounded-2xl">
                <div class="w-16 h-16 bg-slate-800/60 rounded-full flex items-center justify-center text-slate-500 mb-4 text-2xl">
                    <i class="fa-solid fa-clipboard-check"></i>
                </div>
                <h3 class="text-lg font-semibold text-slate-200 mb-1">No tasks found</h3>
                <p class="text-slate-400 text-sm max-w-xs">You're all caught up! Add a new task above to get started.</p>
            </div>

        </main>
        
        <!-- Footer -->
        <footer class="mt-12 text-center text-xs text-slate-500 border-t border-slate-900 pt-6">
            <p>To-Do List App &bull; Powered by Spring Boot REST API &amp; Tailwind CSS</p>
        </footer>
    </div>

    <!-- Main JavaScript file connecting frontend to Spring Boot backend -->
    <script src="app.js"></script>
</body>
</html>
